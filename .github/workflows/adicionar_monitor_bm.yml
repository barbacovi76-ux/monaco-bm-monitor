name: Adicionar monitor-bm nas contas

on:
  workflow_dispatch:

jobs:
  adicionar-permissoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python backend/adicionar_monitor_bm.py
        env:
          ADS_MANAGER_TOKEN: ${{ secrets.META_TOKEN }}
