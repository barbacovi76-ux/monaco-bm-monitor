name: Teste WhatsApp
on:
  workflow_dispatch:
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python backend/teste_whatsapp.py
        env:
          WPP_API_URL: ${{ secrets.WPP_API_URL }}
          WPP_API_KEY: ${{ secrets.WPP_API_KEY }}
          WPP_INSTANCIA: ${{ secrets.WPP_INSTANCIA }}
          GRUPO_OPERACOES: ${{ secrets.GRUPO_OPERACOES }}
