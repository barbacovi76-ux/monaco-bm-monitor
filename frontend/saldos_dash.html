<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saldos — Monaco Agency</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="monaco.css">
<style>
.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px; margin-bottom: 20px;
}
.sc {
  background: var(--s3); border: 1px solid var(--b1);
  border-radius: 10px; padding: 14px 16px;
}
.sc-label { font-size: 10px; color: var(--dim); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: 500; }
.sc-val { font-size: 24px; font-weight: 700; font-feature-settings: 'tnum'; }
.sc-val.red   { color: var(--red);   }
.sc-val.amber { color: var(--amber); }
.sc-val.green { color: var(--green); }
.sc-val.white { color: #fff;         }

.filters {
  display: flex; gap: 10px; margin-bottom: 14px;
  flex-wrap: wrap; align-items: center;
}

.search-wrap {
  display: flex; align-items: center; gap: 8px;
  background: var(--s3); border: 1px solid var(--b2);
  border-radius: 6px; padding: 7px 12px;
  flex: 1; min-width: 200px;
  transition: border-color var(--t-fast);
}
.search-wrap:focus-within { border-color: var(--gold-dim); }
.search-wrap i { color: var(--dim); font-size: 16px; }
.search-wrap input { background: transparent; border: none; color: var(--text); font-size: 13px; outline: none; width: 100%; }
.search-wrap input::placeholder { color: var(--dim); }

.nome-cell { font-weight: 500; color: var(--text); font-size: 13px; }
.id-cell { font-size: 10px; color: var(--dim); margin-top: 3px; font-family: var(--mono); }
.saldo-val { font-weight: 700; font-size: 14px; font-feature-settings: 'tnum'; }
.saldo-val.red   { color: var(--red);   }
.saldo-val.amber { color: var(--amber); }
.saldo-val.green { color: var(--green); }

.bar-wrap { width: 100px; height: 4px; background: var(--b2); border-radius: 2px; overflow: hidden; display: inline-block; vertical-align: middle; }
.bar-fill  { height: 100%; border-radius: 2px; transition: width .4s ease; }
.progress-row { display: flex; align-items: center; gap: 8px; }
.limit-val { font-size: 11px; color: var(--dim); }

.last-upd { font-size: 11px; color: var(--dim); font-family: var(--mono); }
</style>
</head>
<body>

<header class="hdr">
  <a href="dashboard.html" class="logo">
    <div class="logo-mark">M</div>
    <div class="logo-text">
      <span class="logo-name">Monaco Agency</span>
      <span class="logo-sub">BM Monitor</span>
    </div>
    <div class="logo-divider"></div>
    <span class="logo-page">Saldos</span>
  </a>

  <div class="hdr-nav">
    <span class="last-upd" id="last-upd"></span>
    <button class="btn btn-gold" onclick="carregarSaldos()" id="btn-atualizar">
      <i class="ti ti-refresh"></i> Atualizar
    </button>
    <a href="dashboard.html" class="btn">
      <i class="ti ti-arrow-left"></i> Dashboard
    </a>
  </div>
</header>

<div class="container">

  <div class="summary">
    <div class="sc"><div class="sc-label">Total de BMs</div><div class="sc-val white" id="s-total">—</div></div>
    <div class="sc"><div class="sc-label">Crítico (&lt; R$50)</div><div class="sc-val red" id="s-critico">—</div></div>
    <div class="sc"><div class="sc-label">Baixo (&lt; R$100)</div><div class="sc-val amber" id="s-baixo">—</div></div>
    <div class="sc"><div class="sc-label">Normal (&gt; R$100)</div><div class="sc-val green" id="s-ok">—</div></div>
    <div class="sc"><div class="sc-label">Limite crítico</div><div class="sc-val white" id="s-limite-crit">R$ 50</div></div>
    <div class="sc"><div class="sc-label">Limite baixo</div><div class="sc-val white" id="s-limite-baixo">R$ 100</div></div>
  </div>

  <div class="filters">
    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" id="busca" placeholder="Buscar conta..." oninput="filtrar()">
    </div>
    <select id="filtro-status" onchange="filtrar()">
      <option value="">Todos os status</option>
      <option value="critico">Crítico</option>
      <option value="baixo">Baixo</option>
      <option value="ok">Normal</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Conta / BM</th>
          <th>Saldo disponível</th>
          <th>Limite de gasto</th>
          <th>Utilização</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="5" style="text-align:center;padding:48px 16px;color:var(--dim);font-size:13px;">Clique em <strong style="color:var(--text)">Atualizar</strong> para carregar os saldos</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
const TOKEN_KEY = 'monaco_meta_token';
const API_VERSION = 'v19.0';
const token = localStorage.getItem(TOKEN_KEY);

const LIMITE_CRITICO = 50;
const LIMITE_BAIXO = 100;

document.getElementById('s-limite-crit').textContent = 'R$ ' + LIMITE_CRITICO;
document.getElementById('s-limite-baixo').textContent = 'R$ ' + LIMITE_BAIXO;

const CONTAS = [
  { nome: 'Rosa Sul Nova',           id: 'act_2523170184768797', tipo: 'food' },
  { nome: 'Mollinari',               id: 'act_459274303920372',  tipo: 'food' },
  { nome: 'Villa Grano',             id: 'act_909424425271250',  tipo: 'food' },
  { nome: 'Brados',                  id: 'act_972023765779926',  tipo: 'food' },
  { nome: 'Berlim',                  id: 'act_836447545843342',  tipo: 'food' },
  { nome: 'CA RJK SHOP',             id: 'act_297417165372711',  tipo: 'outros' },
  { nome: 'CA - Miotto Construtora', id: 'act_213109970735074',  tipo: 'outros' },
  { nome: 'CA - ICGP',               id: 'act_360815898753195',  tipo: 'outros' },
  { nome: 'CA - Monaco Agency',      id: 'act_732966175219099',  tipo: 'outros' },
  { nome: 'BRUNA MACHADO - DOTCON',  id: 'act_1102427261426373', tipo: 'outros' },
  { nome: 'CA - AMK Estética',       id: 'act_590117117342811',  tipo: 'outros' },
  { nome: 'JS - UNIFORME',           id: 'act_1452225369942067', tipo: 'outros' },
  { nome: 'SH Tijolos',              id: 'act_3858259327816511', tipo: 'outros' },
];

const fmt = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
let dadosSaldos = [];

function getStatus(saldo) {
  if (saldo <= LIMITE_CRITICO) return 'critico';
  if (saldo <= LIMITE_BAIXO) return 'baixo';
  return 'ok';
}

async function carregarSaldos() {
  if (!token) {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--dim)">Token não encontrado. Volte ao dashboard e salve o token.</td></tr>';
    return;
  }
  const btn = document.getElementById('btn-atualizar');
  btn.innerHTML = '<i class="ti ti-loader"></i> Carregando...';
  btn.disabled = true;
  document.getElementById('tbody').innerHTML = `<tr><td colspan="5"><div class="loading"><div class="spinner"></div>Consultando ${CONTAS.length} contas...</div></td></tr>`;
  dadosSaldos = [];

  for (const conta of CONTAS) {
    try {
      const url = `https://graph.facebook.com/${API_VERSION}/${conta.id}?fields=name,balance,spend_cap,amount_spent,account_status&access_token=${token}`;
      const r = await fetch(url);
      const d = await r.json();
      if (d.error) {
        dadosSaldos.push({ ...conta, saldo: 0, spendCap: 0, amountSpent: 0, status: 'critico', erro: true });
        continue;
      }
      const rawSC = parseInt(d.spend_cap || 0);
      const rawAS = parseInt(d.amount_spent || 0);
      const rawBal = parseInt(d.balance || 0);
      const spendCap = rawSC / 100;
      const amountSpent = rawAS / 100;
      const saldo = rawSC > 0 ? spendCap - amountSpent : rawBal / 100;
      const pctUsado = spendCap > 0 ? Math.min((amountSpent / spendCap) * 100, 100) : 0;
      dadosSaldos.push({ ...conta, saldo, spendCap, amountSpent, pctUsado, status: getStatus(saldo), erro: false });
    } catch (e) {
      dadosSaldos.push({ ...conta, saldo: 0, spendCap: 0, amountSpent: 0, status: 'critico', erro: true });
    }
  }

  const critico = dadosSaldos.filter(d => d.status === 'critico').length;
  const baixo   = dadosSaldos.filter(d => d.status === 'baixo').length;
  const ok      = dadosSaldos.filter(d => d.status === 'ok').length;
  document.getElementById('s-total').textContent   = dadosSaldos.length;
  document.getElementById('s-critico').textContent = critico;
  document.getElementById('s-baixo').textContent   = baixo;
  document.getElementById('s-ok').textContent      = ok;
  document.getElementById('last-upd').textContent  = new Date().toLocaleTimeString('pt-BR');

  btn.innerHTML = '<i class="ti ti-refresh"></i> Atualizar';
  btn.disabled = false;
  filtrar();
}

function filtrar() {
  const busca = document.getElementById('busca').value.toLowerCase();
  const filtroStatus = document.getElementById('filtro-status').value;
  let dados = dadosSaldos.filter(d =>
    (!busca || d.nome.toLowerCase().includes(busca)) &&
    (!filtroStatus || d.status === filtroStatus)
  );
  const ordem = { critico: 0, baixo: 1, ok: 2 };
  dados.sort((a, b) => {
    if (ordem[a.status] !== ordem[b.status]) return ordem[a.status] - ordem[b.status];
    return a.saldo - b.saldo;
  });

  const tbody = document.getElementById('tbody');
  if (!dados.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--dim)">Nenhuma conta encontrada</td></tr>';
    return;
  }

  const barColor = { critico: 'var(--red)', baixo: 'var(--amber)', ok: 'var(--green)' };
  const badgeMap = {
    critico: '<span class="badge badge-red">Crítico</span>',
    baixo:   '<span class="badge badge-amber">Baixo</span>',
    ok:      '<span class="badge badge-green">Normal</span>',
  };

  tbody.innerHTML = dados.map(d => {
    const pct = d.spendCap > 0 ? Math.min(d.pctUsado, 100) : 0;
    const cor = barColor[d.status];
    const saldoClass = d.status === 'critico' ? 'red' : d.status === 'baixo' ? 'amber' : 'green';
    return `<tr>
      <td>
        <div class="nome-cell">${d.nome}</div>
        <div class="id-cell">${d.id}</div>
      </td>
      <td><span class="saldo-val ${saldoClass}">${fmt(d.saldo)}</span></td>
      <td style="color:var(--text2);">${d.spendCap > 0 ? fmt(d.spendCap) : '—'}</td>
      <td>
        ${d.spendCap > 0 ? `
          <div class="progress-row">
            <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${cor};"></div></div>
            <span class="limit-val">${pct.toFixed(0)}%</span>
          </div>
          <div style="font-size:10px;color:var(--dim);margin-top:3px;">${fmt(d.amountSpent)} gasto</div>
        ` : '<span style="color:var(--dim)">—</span>'}
      </td>
      <td>${badgeMap[d.status] || ''}</td>
    </tr>`;
  }).join('');
}
</script>
</body>
</html>
