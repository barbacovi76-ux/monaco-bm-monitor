<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saldos — Monaco Agency</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="monaco.css">
<style>
.summary {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px; margin-bottom: 24px;
}
.sc {
  background: linear-gradient(180deg, var(--card2), var(--card));
  border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
}
.sc-label { font-size: 10.5px; color: var(--mute); margin-bottom: 8px; text-transform: uppercase;
  letter-spacing: .07em; font-weight: 500; font-family: var(--mono); }
.sc-val { font-size: 24px; font-weight: 600; font-feature-settings: 'tnum'; letter-spacing: -.04em; line-height: 1; }
.sc-val.red   { color: var(--red);   }
.sc-val.amber { color: var(--amber); }
.sc-val.green { color: var(--green); }
.sc-val.white { color: var(--hi);    }

.filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }

.search-wrap {
  display: flex; align-items: center; gap: 8px;
  background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
  flex: 1; min-width: 200px; transition: border-color .12s;
}
.search-wrap:focus-within { border-color: var(--line2); }
.search-wrap i { color: var(--dim); font-size: 15px; }
.search-wrap input { background: transparent; border: none; color: var(--ink); font-size: 13px; outline: none; width: 100%; font-family: var(--sans); }
.search-wrap input::placeholder { color: var(--dim); }

.nome-cell { font-weight: 600; color: var(--ink); font-size: 13px; letter-spacing: -.02em; }
.id-cell { font-size: 10px; color: var(--dim); margin-top: 3px; font-family: var(--mono); letter-spacing: .04em; }
.saldo-val { font-weight: 600; font-size: 14px; font-feature-settings: 'tnum'; font-family: var(--mono); }
.saldo-val.red   { color: var(--red);   }
.saldo-val.amber { color: var(--amber); }
.saldo-val.green { color: var(--green); }

.bar-wrap { width: 90px; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; display: inline-block; vertical-align: middle; }
.bar-fill  { height: 100%; border-radius: 2px; transition: width .4s ease; }
.progress-row { display: flex; align-items: center; gap: 8px; }
.limit-val { font-size: 11px; color: var(--dim); font-family: var(--mono); }

.last-upd { font-size: 11px; color: var(--dim); font-family: var(--mono); letter-spacing: .05em; }
</style>
</head>
<body>

<header class="hdr">
  <a href="dashboard.html" class="logo">
    <div class="logo-mark">M</div>
    <div class="logo-text">
      <span class="logo-name">Monaco Agency</span>
      <span class="logo-sub">BM Monitor</span>
    </div>
    <div class="logo-divider"></div>
    <span class="logo-page">Saldos</span>
  </a>

  <div class="hdr-nav">
    <span class="last-upd" id="last-upd"></span>
    <button class="btn btn-primary" onclick="carregarSaldos()" id="btn-atualizar">
      <i class="ti ti-refresh"></i> Atualizar
    </button>
    <a href="dashboard.html" class="btn">
      <i class="ti ti-arrow-left"></i> Dashboard
    </a>
  </div>
</header>

<div class="container">

  <div class="summary">
    <div class="sc"><div class="sc-label">Total de BMs</div><div class="sc-val white" id="s-total">—</div></div>
    <div class="sc"><div class="sc-label">Crítico (&lt; R$50)</div><div class="sc-val red" id="s-critico">—</div></div>
    <div class="sc"><div class="sc-label">Baixo (&lt; R$100)</div><div class="sc-val amber" id="s-baixo">—</div></div>
    <div class="sc"><div class="sc-label">Normal (&gt; R$100)</div><div class="sc-val green" id="s-ok">—</div></div>
    <div class="sc"><div class="sc-label">Limite crítico</div><div class="sc-val white" id="s-limite-crit">R$ 50</div></div>
    <div class="sc"><div class="sc-label">Limite baixo</div><div class="sc-val white" id="s-limite-baixo">R$ 100</div></div>
  </div>

  <div class="filters">
    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" id="busca" placeholder="Buscar conta..." oninput="filtrar()">
    </div>
    <select id="filtro-status" onchange="filtrar()">
      <option value="">Todos os status</option>
      <option value="critico">Crítico</option>
      <option value="baixo">Baixo</option>
      <option value="ok">Normal</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Conta / BM</th>
          <th>Saldo disponível</th>
          <th>Limite de gasto</th>
          <th>Utilização</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="5" style="text-align:center;padding:48px 16px;color:var(--dim);font-size:13px;">Clique em <strong style="color:var(--text)">Atualizar</strong> para carregar os saldos</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
const TOKEN_KEY = 'monaco_meta_token';
const API_VERSION = 'v19.0';
const token = localStorage.getItem(TOKEN_KEY);

const LIMITE_CRITICO = 50;
const LIMITE_BAIXO = 100;

const WPP_URL = 'https://evolution-api-production-2227.up.railway.app';
const WPP_KEY = 'monaco123';
const WPP_INSTANCIA = 'teste';
const GRUPO_OPERACOES = '120363403884174816@g.us';

document.getElementById('s-limite-crit').textContent = 'R$ ' + LIMITE_CRITICO;
document.getElementById('s-limite-baixo').textContent = 'R$ ' + LIMITE_BAIXO;

const CONTAS = [
  { nome: 'Rosa Sul Nova',                id: 'act_2523170184768797'      },
  { nome: 'Mollinari',                    id: 'act_459274303920372'       },
  { nome: 'Berlim',                       id: 'act_836447545843342'       },
  { nome: 'Bari Pizzas',                  id: 'act_435579423245411'       },
  { nome: 'Restaurante da Samires 2',     id: 'act_1304028087651228'      },
  { nome: 'Perché Pizzaria',              id: 'act_120205099089530533'    },
  { nome: 'Perché Pizzaria 02',           id: 'act_676495468011602'       },
  { nome: 'Pizza e Cia',                  id: 'act_1284872655528904'      },
  { nome: 'La Reina Restaurante',         id: 'act_120250312780030207'    },
  { nome: 'Capivara Urbana',              id: 'act_120246923829650209'    },
  { nome: 'Marcelo Burguer',              id: 'act_6963889842385'         },
  { nome: 'CA RJK SHOP',                  id: 'act_297417165372711'       },
  { nome: 'CA - Miotto Construtora',      id: 'act_213109970735074'       },
  { nome: 'CA - ICGP',                    id: 'act_360815898753195'       },
  { nome: 'BRUNA MACHADO - DOTCON',       id: 'act_1102427261426373'      },
  { nome: 'CA - AMK Estetica',            id: 'act_590117117342811'       },
  { nome: 'SH Tijolos',                   id: 'act_3858259327816511'      },
  { nome: 'CA1 - Doces Mania',            id: 'act_105301940058633'       },
  { nome: 'Coonecta',                     id: 'act_566362413094185'       },
  { nome: 'MIL BR SVA LTDA',              id: 'act_1054071956093512'      },
  { nome: 'Dot Everton',                  id: 'act_1242530613606108'      },
  { nome: 'CA - IZEE Securitizad',        id: 'act_1571125566708805'      },
  { nome: 'CA-KVAgro',                    id: 'act_1949417395697365'      },
  { nome: 'Estúdio Vitória Daronch',      id: 'act_1517516869463790'      },
  { nome: 'Pr Farma',                     id: 'act_883217132319518'       },
  { nome: 'Shineray Cascavel',            id: 'act_1704232320268521'      },
  { nome: 'Shineray Francisco Beltrão',   id: 'act_4119452628365493'      },
];

const fmt = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
let dadosSaldos = [];

function getStatus(saldo) {
  if (saldo <= LIMITE_CRITICO) return 'critico';
  if (saldo <= LIMITE_BAIXO) return 'baixo';
  return 'ok';
}

async function carregarSaldos() {
  if (!token) {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--dim)">Token não encontrado. Volte ao dashboard e salve o token.</td></tr>';
    return;
  }
  const btn = document.getElementById('btn-atualizar');
  btn.innerHTML = '<i class="ti ti-loader"></i> Carregando...';
  btn.disabled = true;
  document.getElementById('tbody').innerHTML = `<tr><td colspan="5"><div class="loading"><div class="spinner"></div>Consultando ${CONTAS.length} contas...</div></td></tr>`;
  dadosSaldos = [];

  for (const conta of CONTAS) {
    try {
      const url = `https://graph.facebook.com/${API_VERSION}/${conta.id}?fields=name,balance,spend_cap,amount_spent,account_status&access_token=${token}`;
      const r = await fetch(url);
      const d = await r.json();
      if (d.error) {
        dadosSaldos.push({ ...conta, saldo: 0, spendCap: 0, amountSpent: 0, status: 'critico', erro: true });
        continue;
      }
      const rawSC = parseInt(d.spend_cap || 0);
      const rawAS = parseInt(d.amount_spent || 0);
      const rawBal = parseInt(d.balance || 0);
      const spendCap = rawSC / 100;
      const amountSpent = rawAS / 100;
      const saldo = rawSC > 0 ? spendCap - amountSpent : rawBal / 100;
      const pctUsado = spendCap > 0 ? Math.min((amountSpent / spendCap) * 100, 100) : 0;
      dadosSaldos.push({ ...conta, saldo, spendCap, amountSpent, pctUsado, status: getStatus(saldo), erro: false });
    } catch (e) {
      dadosSaldos.push({ ...conta, saldo: 0, spendCap: 0, amountSpent: 0, status: 'critico', erro: true });
    }
  }

  const critico = dadosSaldos.filter(d => d.status === 'critico').length;
  const baixo   = dadosSaldos.filter(d => d.status === 'baixo').length;
  const ok      = dadosSaldos.filter(d => d.status === 'ok').length;
  document.getElementById('s-total').textContent   = dadosSaldos.length;
  document.getElementById('s-critico').textContent = critico;
  document.getElementById('s-baixo').textContent   = baixo;
  document.getElementById('s-ok').textContent      = ok;
  document.getElementById('last-upd').textContent  = new Date().toLocaleTimeString('pt-BR');

  btn.innerHTML = '<i class="ti ti-refresh"></i> Atualizar';
  btn.disabled = false;
  filtrar();

  // Envio automático se houver crítico ou baixo
  const alertas = dadosSaldos.filter(d => d.status === 'critico' || d.status === 'baixo');
  if (alertas.length > 0) enviarAlertaSaldo(alertas);
}

async function enviarAlertaSaldo(alertas) {
  const agora = new Date().toLocaleString('pt-BR', {
    day:'2-digit', month:'2-digit', year:'numeric',
    hour:'2-digit', minute:'2-digit'
  });
  const criticos = alertas.filter(d => d.status === 'critico');
  const baixos   = alertas.filter(d => d.status === 'baixo');

  const fmt2 = v => v.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
  let linhas = [
    '🤖 BOB Saldos — Monaco Agency',
    agora,
    ''
  ];
  if (criticos.length) {
    linhas.push('🔴 CRÍTICO (' + criticos.length + ')');
    criticos.forEach(d => linhas.push('  · ' + d.nome + ' → ' + fmt2(d.saldo)));
    linhas.push('');
  }
  if (baixos.length) {
    linhas.push('🟡 BAIXO (' + baixos.length + ')');
    baixos.forEach(d => linhas.push('  · ' + d.nome + ' → ' + fmt2(d.saldo)));
    linhas.push('');
  }
  linhas.push('Recarregar saldo em: ' + window.location.href);

  try {
    await fetch(WPP_URL + '/message/sendText/' + WPP_INSTANCIA, {
      method: 'POST',
      headers: { 'apikey': WPP_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ number: GRUPO_OPERACOES, textMessage: { text: linhas.join('\n') } })
    });
  } catch(e) {}
}

function filtrar() {
  const busca = document.getElementById('busca').value.toLowerCase();
  const filtroStatus = document.getElementById('filtro-status').value;
  let dados = dadosSaldos.filter(d =>
    (!busca || d.nome.toLowerCase().includes(busca)) &&
    (!filtroStatus || d.status === filtroStatus)
  );
  const ordem = { critico: 0, baixo: 1, ok: 2 };
  dados.sort((a, b) => {
    if (ordem[a.status] !== ordem[b.status]) return ordem[a.status] - ordem[b.status];
    return a.saldo - b.saldo;
  });

  const tbody = document.getElementById('tbody');
  if (!dados.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--dim)">Nenhuma conta encontrada</td></tr>';
    return;
  }

  const barColor = { critico: 'var(--red)', baixo: 'var(--amber)', ok: 'var(--green)' };
  const badgeMap = {
    critico: '<span class="badge badge-red">Crítico</span>',
    baixo:   '<span class="badge badge-amber">Baixo</span>',
    ok:      '<span class="badge badge-green">Normal</span>',
  };

  tbody.innerHTML = dados.map(d => {
    const pct = d.spendCap > 0 ? Math.min(d.pctUsado, 100) : 0;
    const cor = barColor[d.status];
    const saldoClass = d.status === 'critico' ? 'red' : d.status === 'baixo' ? 'amber' : 'green';
    return `<tr>
      <td>
        <div class="nome-cell">${d.nome}</div>
        <div class="id-cell">${d.id}</div>
      </td>
      <td><span class="saldo-val ${saldoClass}">${fmt(d.saldo)}</span></td>
      <td style="color:var(--ink2);">${d.spendCap > 0 ? fmt(d.spendCap) : '—'}</td>
      <td>
        ${d.spendCap > 0 ? `
          <div class="progress-row">
            <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${cor};"></div></div>
            <span class="limit-val">${pct.toFixed(0)}%</span>
          </div>
          <div style="font-size:10px;color:var(--dim);margin-top:3px;">${fmt(d.amountSpent)} gasto</div>
        ` : '<span style="color:var(--dim)">—</span>'}
      </td>
      <td>${badgeMap[d.status] || ''}</td>
    </tr>`;
  }).join('');
}
</script>
</body>
</html>
