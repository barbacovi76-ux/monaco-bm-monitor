<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOB Voice — Monaco Agency</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="monaco.css">
<style>

/* ── BOB page layout ── */
.main { max-width: 800px; margin: 0 auto; padding: 40px 24px 80px; }

/* ── Token config ── */
.token-bar {
  background: var(--card2); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 16px; margin-bottom: 32px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.token-bar label { font-size: 11px; color: var(--dim); white-space: nowrap; text-transform: uppercase; letter-spacing: .5px; font-family: var(--mono); }
.token-bar input { flex: 1; min-width: 180px; font-family: var(--mono); }
.btn-save { padding: 7px 16px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid var(--gold); background: var(--gold-bg); color: var(--gold); font-weight: 600; transition: all var(--t-fast); }
.btn-save:hover { background: var(--gold); color: #000; }
.tag-ok { font-size: 11px; color: var(--green); padding: 5px 12px; border-radius: 6px; background: var(--green2); border: 1px solid rgba(0,230,118,.2); font-family: var(--mono); display: flex; align-items: center; gap: 6px; }

/* ── Jarvis Ring ── */
.jarvis-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; gap: 20px; }

.ring-outer {
  position: relative; width: 200px; height: 200px;
  cursor: pointer; user-select: none;
}

.ring {
  position: absolute; border-radius: 50%;
  border: 2px solid transparent;
  animation: ring-spin 8s linear infinite;
}
.ring-1 { inset: 0; border-top-color: var(--gold); border-right-color: rgba(245,197,24,.3); animation-duration: 6s; }
.ring-2 { inset: 14px; border-bottom-color: #2979ff; border-left-color: rgba(41,121,255,.3); animation-duration: 10s; animation-direction: reverse; }
.ring-3 { inset: 28px; border-top-color: rgba(245,197,24,.5); animation-duration: 4s; }

@keyframes ring-spin { to { transform: rotate(360deg); } }

/* núcleo central */
.ring-core {
  position: absolute; inset: 42px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(245,197,24,.15) 0%, rgba(41,121,255,.08) 50%, transparent 70%);
  border: 1px solid rgba(245,197,24,.3);
  display: flex; align-items: center; justify-content: center;
  transition: all .3s;
}

/* BOB icon: geometric "B" instead of robot emoji */
.ring-core-icon {
  width: 42px; height: 42px;
  background: var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 18px; font-weight: 700; color: #000;
  letter-spacing: -1px;
  clip-path: polygon(0 0, 100% 0, 100% 72%, 72% 100%, 0 100%);
}

/* estados */
.ring-outer.ouvindo .ring-1 { border-top-color: var(--green); border-right-color: rgba(0,230,118,.4); animation-duration: 1.5s; }
.ring-outer.ouvindo .ring-core { background: radial-gradient(circle, rgba(0,230,118,.2) 0%, transparent 70%); border-color: rgba(0,230,118,.5); box-shadow: 0 0 30px rgba(0,230,118,.2); }

.ring-outer.falando .ring-1 { border-top-color: var(--blue); animation-duration: 2s; }
.ring-outer.falando .ring-2 { border-bottom-color: var(--gold); animation-duration: 3s; }
.ring-outer.falando .ring-core { background: radial-gradient(circle, rgba(41,121,255,.2) 0%, transparent 70%); border-color: rgba(41,121,255,.5); box-shadow: 0 0 40px rgba(41,121,255,.25); }

.ring-outer.processando .ring-1 { border-top-color: var(--amber); animation-duration: 1s; }
.ring-outer.processando .ring-core { background: radial-gradient(circle, rgba(255,171,0,.15) 0%, transparent 70%); }

/* Status text */
.bob-status { font-size: 12px; color: var(--dim); letter-spacing: .5px; text-align: center; min-height: 18px; transition: color .3s; font-family: var(--mono); }
.bob-status.ouvindo    { color: var(--green); }
.bob-status.falando    { color: var(--blue); }
.bob-status.processando { color: var(--amber); }

/* Mic / control buttons */
.ctrl-btns { display: flex; gap: 12px; align-items: center; }

.mic-btn {
  width: 48px; height: 48px; border-radius: 50%;
  border: 1px solid var(--line2); background: var(--bg2);
  font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all var(--t-fast); color: var(--ink2);
}
.mic-btn i { font-size: 20px; }
.mic-btn:hover { border-color: var(--gold-dim); background: var(--gold-bg); color: var(--gold); }
.mic-btn.ouvindo { border-color: var(--green); background: var(--green2); color: var(--green); animation: pulse-green 1.5s infinite; }
.mic-btn.pause-active { border-color: var(--amber); background: var(--amber2); color: var(--amber); }

@keyframes pulse-green { 0%,100%{box-shadow:0 0 0 0 rgba(0,230,118,.4)} 50%{box-shadow:0 0 0 12px rgba(0,230,118,0)} }

/* ── Transcript ── */
.transcript {
  background: var(--card2); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 18px; margin-bottom: 16px; font-size: 13px;
  color: var(--dim); font-style: italic; min-height: 48px;
  transition: border-color var(--t-fast);
}
.transcript.ativo { border-color: rgba(245,197,24,.3); color: var(--ink); font-style: normal; }

/* ── Resposta BOB ── */
.resposta {
  background: var(--card2); border: 1px solid rgba(245,197,24,.2);
  border-radius: 10px; padding: 20px; margin-bottom: 24px;
  display: none; animation: fadeUp .3s ease;
}
.resposta.show { display: block; }
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.resposta-label { font-size: 10px; color: var(--gold); font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 10px; font-family: var(--mono); display: flex; align-items: center; gap: 6px; }
.resposta-txt { font-size: 14px; line-height: 1.9; color: var(--ink); }

/* ── Comandos ── */
.cmds-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin-bottom: 32px; }
.cmd {
  background: var(--card2); border: 1px solid var(--line);
  border-radius: 8px; padding: 12px 14px; font-size: 12px;
  color: var(--dim); cursor: pointer; text-align: left;
  transition: all var(--t-fast); line-height: 1.5; font-family: var(--sans);
  display: flex; align-items: flex-start; gap: 10px;
}
.cmd:hover { border-color: var(--gold-dim); color: var(--ink); background: var(--bg2); }
.cmd i { font-size: 16px; color: var(--dim); flex-shrink: 0; margin-top: 1px; transition: color var(--t-fast); }
.cmd:hover i { color: var(--gold); }

/* ── Histórico ── */
.msgs { display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; gap: 10px; }
.msg.user { flex-direction: row-reverse; }
.msg-av {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.msg.bob .msg-av {
  background: linear-gradient(135deg, rgba(245,197,24,.3), rgba(41,121,255,.2));
  border: 1px solid rgba(245,197,24,.3);
  font-size: 12px; font-weight: 700; color: var(--gold); font-family: var(--mono);
}
.msg.user .msg-av { background: var(--bg2); border: 1px solid var(--line2); font-size: 9px; font-weight: 700; color: var(--dim); }
.msg-bubble { max-width: 78%; padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.7; }
.msg.bob .msg-bubble { background: var(--card2); border: 1px solid var(--line); color: var(--ink); }
.msg.user .msg-bubble { background: var(--gold-bg); border: 1px solid rgba(245,197,24,.2); color: var(--gold); }

.dots { display: inline-flex; gap: 4px; }
.dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--dim); animation: dot-bounce 1.2s infinite; }
.dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}
@keyframes dot-bounce { 0%,80%,100%{transform:scale(.7);opacity:.4} 40%{transform:scale(1);opacity:1} }

/* status dot */
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); animation: blink-dot 2s infinite; flex-shrink: 0; }
@keyframes blink-dot { 0%,100%{opacity:1} 50%{opacity:.3} }
</style>
</head>
<body>

<header class="hdr">
  <a href="dashboard.html" class="logo">
    <div class="logo-mark">M</div>
    <div class="logo-text">
      <span class="logo-name">Monaco Agency</span>
      <span class="logo-sub">BM Monitor</span>
    </div>
    <div class="logo-divider"></div>
    <span class="logo-page">BOB Voice</span>
  </a>

  <div class="hdr-nav">
    <div class="status-dot" id="online-dot" title="BOB online"></div>
    <a href="dashboard.html" class="btn">
      <i class="ti ti-arrow-left"></i> Dashboard
    </a>
  </div>
</header>

<div class="main">

  <!-- Token -->
  <div class="token-bar" id="token-bar">
    <label>Meta Token:</label>
    <input type="password" id="token-input" placeholder="EAAxxxxxxxx...">
    <button class="btn-save" onclick="salvarToken()">Salvar</button>
  </div>

  <!-- Jarvis -->
  <div class="jarvis-wrap">
    <div class="ring-outer" id="ring" onclick="toggleMic()" title="Clique para falar">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <div class="ring-core">
        <div class="ring-core-icon">B</div>
      </div>
    </div>
    <div class="bob-status" id="status">Clique no anel ou no microfone para falar</div>
    <div class="ctrl-btns">
      <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="Microfone">
        <i class="ti ti-microphone"></i>
      </button>
      <button class="mic-btn" id="pause-btn" onclick="pausarFala()" title="Pausar / retomar fala">
        <i class="ti ti-player-pause"></i>
      </button>
    </div>
  </div>

  <!-- Transcript -->
  <div class="transcript" id="transcript">Aguardando comando de voz...</div>

  <!-- Resposta -->
  <div class="resposta" id="resposta">
    <div class="resposta-label">
      <i class="ti ti-message-dots"></i> BOB responde
    </div>
    <div class="resposta-txt" id="resposta-txt"></div>
  </div>

  <!-- Comandos -->
  <div class="section-title" style="margin-bottom:12px;">Comandos sugeridos</div>
  <div class="cmds-grid">
    <button class="cmd" onclick="exec('Relatório de desempenho dos últimos 7 dias')"><i class="ti ti-chart-bar"></i>Desempenho 7 dias</button>
    <button class="cmd" onclick="exec('Relatório dos últimos 30 dias')"><i class="ti ti-calendar-month"></i>Desempenho 30 dias</button>
    <button class="cmd" onclick="exec('Quais campanhas estão com ROAS baixo?')"><i class="ti ti-alert-triangle"></i>Campanhas críticas</button>
    <button class="cmd" onclick="exec('Como está o saldo das contas?')"><i class="ti ti-wallet"></i>Saldo das contas</button>
    <button class="cmd" onclick="exec('Quais campanhas encerram em breve?')"><i class="ti ti-clock"></i>Encerramentos</button>
    <button class="cmd" onclick="exec('Quais são os top performers desta semana?')"><i class="ti ti-trophy"></i>Top performers</button>
    <button class="cmd" onclick="exec('Resumo geral de investimento e faturamento')"><i class="ti ti-shopping-cart"></i>Investimento total</button>
    <button class="cmd" onclick="exec('Qual o ROAS médio de todas as contas?')"><i class="ti ti-rocket"></i>ROAS médio</button>
  </div>

  <!-- Histórico -->
  <div class="section-title" style="margin-top:8px;margin-bottom:14px;">Histórico</div>
  <div class="msgs" id="msgs"></div>

</div>

<script>
const TOKEN_KEY = 'monaco_meta_token';
const API_VER   = 'v19.0';
const fmt = v => Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtN = v => Number(v).toLocaleString('pt-BR');

let token = localStorage.getItem(TOKEN_KEY) || '';
let rec = null, synth = window.speechSynthesis;
let ouvindo = false, processando = false;

// Contas ativas (sem cancelados)
const CONTAS = [
  { nome: 'Rosa Sul Nova',      id: 'act_2523170184768797' },
  { nome: 'Mollinari Pizzaria', id: 'act_459274303920372'  },
  { nome: 'Villa Grano',        id: 'act_909424425271250'  },
  { nome: 'Brados Pizzaria',    id: 'act_972023765779926'  },
  { nome: 'Berlim Pizzaria',    id: 'act_836447545843342'  },
  { nome: 'RJK Shop',           id: 'act_297417165372711'  },
  { nome: 'Miotto Construtora', id: 'act_213109970735074'  },
  { nome: 'ICGP',               id: 'act_360815898753195'  },
  { nome: 'Monaco Agency',      id: 'act_732966175219099'  },
  { nome: 'Bruna Machado',      id: 'act_1102427261426373' },
  { nome: 'AMK Estética',       id: 'act_590117117342811'  },
  { nome: 'JS Uniformes',       id: 'act_1452225369942067' },
  { nome: 'SH Tijolos',         id: 'act_3858259327816511' },
];

// ── Token ──────────────────────────────────────────────────────────
function salvarToken() {
  const t = document.getElementById('token-input').value.trim();
  if (t) { localStorage.setItem(TOKEN_KEY, t); token = t; }
  document.getElementById('token-bar').innerHTML = '<span class="tag-ok"><i class="ti ti-check"></i> Token salvo — BOB pronto</span>';
}
if (token) document.getElementById('token-bar').innerHTML = '<span class="tag-ok"><i class="ti ti-check"></i> Token configurado — BOB pronto</span>';

// ── Estado visual ──────────────────────────────────────────────────
function setEstado(estado, txt) {
  const ring = document.getElementById('ring');
  const st   = document.getElementById('status');
  const mic  = document.getElementById('mic-btn');
  ring.className = 'ring-outer' + (estado ? ' ' + estado : '');
  mic.className  = 'mic-btn'    + (estado === 'ouvindo' ? ' ouvindo' : '');
  st.className   = 'bob-status' + (estado ? ' ' + estado : '');
  st.textContent = txt;
}

// ── Speech Recognition ─────────────────────────────────────────────
function initRec() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setEstado('', 'Use Chrome — navegador não suporta voz'); return null; }
  const r = new SR();
  r.lang = 'pt-BR'; r.continuous = false; r.interimResults = true;

  r.onstart  = () => { ouvindo = true; setEstado('ouvindo','Ouvindo... fale agora'); setTranscript('', false); };
  r.onerror  = () => { pararMic(); };
  r.onend    = () => { if (ouvindo && !processando) pararMic(); };

  r.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    setTranscript(final || interim, true);
    if (final) processar(final.trim());
  };
  return r;
}

function toggleMic() {
  if (ouvindo) { pararMic(); return; }
  if (!rec) rec = initRec();
  if (!rec) return;
  try { rec.start(); } catch(e) { rec = initRec(); rec.start(); }
}
function pararMic() {
  ouvindo = false;
  if (rec) try { rec.stop(); } catch(e) {}
  if (!processando) setEstado('', 'Clique no anel ou no microfone para falar');
}
function setTranscript(txt, ativo) {
  const el = document.getElementById('transcript');
  el.textContent = txt || 'Aguardando comando de voz...';
  el.className = 'transcript' + (ativo ? ' ativo' : '');
}

// ── Meta API ───────────────────────────────────────────────────────
async function buscarInsights(preset) {
  const res = [];
  for (const c of CONTAS) {
    try {
      const url = `https://graph.facebook.com/${API_VER}/${c.id}/insights?fields=spend,impressions,clicks,actions,action_values&date_preset=${preset}&access_token=${token}`;
      const d = await fetch(url).then(r=>r.json());
      const ins = d.data?.[0];
      const gasto  = parseFloat(ins?.spend || 0);
      const pedidos = parseInt(ins?.actions?.find(a=>a.action_type==='purchase')?.value || 0);
      const fat     = parseFloat(ins?.action_values?.find(a=>a.action_type==='purchase')?.value || 0);
      const convs   = parseInt(ins?.actions?.find(a=>a.action_type==='onsite_conversion.messaging_conversation_started_7d')?.value || ins?.actions?.find(a=>a.action_type==='lead')?.value || 0);
      res.push({ nome: c.nome, gasto, pedidos, fat, convs, roas: gasto>0&&fat>0?fat/gasto:0, cpr: pedidos>0?gasto/pedidos:0 });
    } catch { res.push({ nome: c.nome, gasto:0, pedidos:0, fat:0, convs:0, roas:0, cpr:0 }); }
  }
  return res;
}

async function buscarSaldos() {
  const res = [];
  for (const c of CONTAS) {
    try {
      const url = `https://graph.facebook.com/${API_VER}/${c.id}?fields=name,balance,spend_cap,amount_spent&access_token=${token}`;
      const d = await fetch(url).then(r=>r.json());
      const sc  = parseInt(d.spend_cap||0)/100;
      const amt = parseInt(d.amount_spent||0)/100;
      const bal = sc>0 ? sc-amt : parseInt(d.balance||0)/100;
      res.push({ nome: c.nome, saldo: bal, limite: sc });
    } catch { res.push({ nome: c.nome, saldo:0, limite:0 }); }
  }
  return res;
}

async function buscarEncerramentos() {
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const res = [];
  for (const c of CONTAS) {
    try {
      const url = `https://graph.facebook.com/${API_VER}/${c.id}/campaigns?fields=name,effective_status,stop_time&limit=50&access_token=${token}`;
      const d = await fetch(url).then(r=>r.json());
      for (const camp of (d.data||[])) {
        if (!camp.stop_time) continue;
        const dt = new Date(camp.stop_time); dt.setHours(0,0,0,0);
        const dias = Math.round((dt-hoje)/86400000);
        if (dias>=0 && dias<=14) res.push({ bm: c.nome, camp: camp.name, dias, status: camp.effective_status });
      }
    } catch {}
  }
  return res.sort((a,b)=>a.dias-b.dias);
}

// ── Interpretar comando localmente ─────────────────────────────────
function interpretarComando(txt) {
  const t = txt.toLowerCase();

  // Período
  let preset = 'last_7d', periodoLabel = 'últimos 7 dias';
  if (t.includes('30') || t.includes('mês') || t.includes('mes')) { preset='last_30d'; periodoLabel='últimos 30 dias'; }
  else if (t.includes('14')) { preset='last_14d'; periodoLabel='últimos 14 dias'; }
  else if (t.includes('ontem')) { preset='yesterday'; periodoLabel='ontem'; }
  else if (t.includes('hoje')) { preset='today'; periodoLabel='hoje'; }

  // Tipo de consulta
  let tipo = 'geral';
  if (t.includes('saldo') || t.includes('recarga') || t.includes('verba') || t.includes('dinheiro')) tipo = 'saldo';
  else if (t.includes('encerr') || t.includes('venc') || t.includes('prazo') || t.includes('acabar')) tipo = 'encerramentos';
  else if (t.includes('top') || t.includes('melhor') || t.includes('destaque')) tipo = 'top';
  else if (t.includes('críti') || t.includes('baixo') || t.includes('ruim') || t.includes('alerta')) tipo = 'critico';

  // Conta específica
  let contaFiltro = null;
  for (const c of CONTAS) {
    const nomes = c.nome.toLowerCase().split(' ');
    if (nomes.some(n => n.length > 3 && t.includes(n))) { contaFiltro = c; break; }
  }

  return { preset, periodoLabel, tipo, contaFiltro };
}

// ── Gerar resposta sem IA externa ──────────────────────────────────
function gerarResposta(tipo, periodoLabel, dados, contaFiltro) {
  if (tipo === 'saldo') {
    const comSaldo = dados.filter(d=>d.saldo>0).sort((a,b)=>a.saldo-b.saldo);
    const semSaldo = dados.filter(d=>d.saldo<=0);
    let r = `Saldos das contas:\n\n`;
    comSaldo.forEach(d => {
      const status = d.saldo < 100 ? '[CRITICO]' : d.saldo < 300 ? '[BAIXO]' : '[OK]';
      r += `${status} ${d.nome}: ${fmt(d.saldo)}${d.limite>0?' / limite '+fmt(d.limite):''}\n`;
    });
    if (semSaldo.length) r += `\nSem saldo/dados: ${semSaldo.map(d=>d.nome).join(', ')}`;
    return r;
  }

  if (tipo === 'encerramentos') {
    if (!dados.length) return 'Nenhuma campanha encerrando nos próximos 14 dias.';
    let r = 'Campanhas encerrando em breve:\n\n';
    dados.forEach(d => {
      const label = d.dias===0?'HOJE':d.dias===1?'AMANHÃ':`em ${d.dias} dias`;
      r += `${label} — ${d.bm}\n  ${d.camp}\n\n`;
    });
    return r.trim();
  }

  // insights
  const ativos = dados.filter(d=>d.gasto>0);
  if (!ativos.length) return `Não encontrei dados de performance para o período (${periodoLabel}). Verifique o token Meta.`;

  const filtrados = contaFiltro ? ativos.filter(d=>d.nome===contaFiltro.nome) : ativos;
  const total_gasto = filtrados.reduce((s,d)=>s+d.gasto,0);
  const total_ped   = filtrados.reduce((s,d)=>s+d.pedidos,0);
  const total_fat   = filtrados.reduce((s,d)=>s+d.fat,0);
  const total_convs = filtrados.reduce((s,d)=>s+d.convs,0);
  const roas_medio  = total_gasto>0&&total_fat>0 ? total_fat/total_gasto : 0;

  if (contaFiltro && filtrados.length) {
    const d = filtrados[0];
    return `${d.nome} — ${periodoLabel}\n\n` +
      `Investido: ${fmt(d.gasto)}\n` +
      (d.pedidos>0 ? `Pedidos: ${fmtN(d.pedidos)}\nFaturamento: ${fmt(d.fat)}\nROAS: ${d.roas.toFixed(2)}x\nCPR: ${fmt(d.cpr)}` :
       d.convs>0 ? `Conversas: ${fmtN(d.convs)}` : `Sem dados de conversão no período.`);
  }

  if (tipo === 'top') {
    const top = [...ativos].filter(d=>d.roas>0).sort((a,b)=>b.roas-a.roas).slice(0,5);
    if (!top.length) return 'Não há dados de ROAS suficientes para ranquear.';
    let r = `Top performers — ${periodoLabel}:\n\n`;
    top.forEach((d,i) => { r += `${i+1}. ${d.nome}: ROAS ${d.roas.toFixed(2)}x | ${fmt(d.fat)} faturado\n`; });
    return r;
  }

  if (tipo === 'critico') {
    const crit = ativos.filter(d=>d.roas>0&&d.roas<3).sort((a,b)=>a.roas-b.roas);
    const semConv = ativos.filter(d=>d.roas===0&&d.convs===0);
    let r = '';
    if (crit.length) {
      r += `ROAS abaixo de 3x:\n`;
      crit.forEach(d=>{ r+=`${d.nome}: ${d.roas.toFixed(2)}x (invest. ${fmt(d.gasto)})\n`; });
    }
    if (semConv.length) {
      r += `\nSem conversões:\n`;
      semConv.forEach(d=>{ r+=`${d.nome}: ${fmt(d.gasto)} investido, 0 conversões\n`; });
    }
    return r || 'Nenhuma conta crítica no período.';
  }

  // geral
  let r = `Resumo geral — ${periodoLabel}\n\n`;
  r += `Total investido: ${fmt(total_gasto)}\n`;
  if (total_ped>0)   r += `Pedidos: ${fmtN(total_ped)}\nFaturamento: ${fmt(total_fat)}\nROAS médio: ${roas_medio.toFixed(2)}x\n`;
  if (total_convs>0) r += `Conversas: ${fmtN(total_convs)}\n`;
  r += `\nPor conta:\n`;
  ativos.sort((a,b)=>b.gasto-a.gasto).forEach(d => {
    r += `${d.nome}: ${fmt(d.gasto)}`;
    if (d.roas>0) r += ` | ROAS ${d.roas.toFixed(2)}x`;
    else if (d.convs>0) r += ` | ${fmtN(d.convs)} convs`;
    r += '\n';
  });
  return r.trim();
}

// ── Processar ──────────────────────────────────────────────────────
async function processar(texto) {
  if (!texto || processando) return;
  if (!token) { falar('Por favor, configure o token do Meta primeiro.'); return; }

  processando = true;
  pararMic();
  setEstado('processando','Buscando dados no Meta...');
  addMsg('user', texto);
  const loadId = addLoading();

  const { preset, periodoLabel, tipo, contaFiltro } = interpretarComando(texto);

  let dados;
  try {
    if (tipo === 'saldo') dados = await buscarSaldos();
    else if (tipo === 'encerramentos') dados = await buscarEncerramentos();
    else dados = await buscarInsights(preset);
  } catch(e) {
    removeLoading(loadId);
    const err = 'Erro ao buscar dados. Verifique o token Meta.';
    addMsg('bob', err); mostrarResposta(err); falar(err);
    processando = false; setEstado('','Clique no anel ou no microfone para falar');
    return;
  }

  const resposta = gerarResposta(tipo, periodoLabel, dados, contaFiltro);
  removeLoading(loadId);
  addMsg('bob', resposta);
  mostrarResposta(resposta);
  falar(resposta);
  processando = false;
}

function exec(cmd) { setTranscript(cmd, true); processar(cmd); }

// ── UI ─────────────────────────────────────────────────────────────
function addMsg(tipo, txt) {
  const div = document.createElement('div');
  div.className = 'msg ' + tipo;
  const av = tipo==='bob' ? 'B' : 'VC';
  div.innerHTML = `<div class="msg-av">${av}</div><div class="msg-bubble">${txt.replace(/\n/g,'<br>')}</div>`;
  document.getElementById('msgs').appendChild(div);
  div.scrollIntoView({behavior:'smooth'});
  return div;
}
function addLoading() {
  const id = 'ld-' + Date.now();
  const div = document.createElement('div');
  div.className='msg bob'; div.id=id;
  div.innerHTML='<div class="msg-av">B</div><div class="msg-bubble"><div class="dots"><span></span><span></span><span></span></div></div>';
  document.getElementById('msgs').appendChild(div);
  div.scrollIntoView({behavior:'smooth'});
  return id;
}
function removeLoading(id) { document.getElementById(id)?.remove(); }
function mostrarResposta(txt) {
  document.getElementById('resposta-txt').innerHTML = txt.replace(/\n/g,'<br>');
  document.getElementById('resposta').classList.add('show');
}

// ── TTS ────────────────────────────────────────────────────────────
function falar(texto) {
  if (!synth) return;
  synth.cancel();
  setEstado('falando','BOB está falando...');

  const limpo = texto
    .replace(/\[[A-Z]+\]/g,'')
    .replace(/\*\*/g,'').replace(/\*/g,'')
    .replace(/<br>/g,'. ')
    .trim();

  const u = new SpeechSynthesisUtterance(limpo);
  u.lang = 'pt-BR'; u.rate = 1.05; u.pitch = 1.0;

  const vozes = synth.getVoices();
  const voz = vozes.find(v=>v.lang==='pt-BR') || vozes.find(v=>v.lang.startsWith('pt'));
  if (voz) u.voice = voz;

  u.onend = () => {
    setEstado('','Clique no anel ou no microfone para falar');
    document.getElementById('pause-btn').querySelector('i').className = 'ti ti-player-pause';
    document.getElementById('pause-btn').classList.remove('pause-active');
  };

  synth.speak(u);
}

if (synth) { synth.onvoiceschanged = ()=>synth.getVoices(); synth.getVoices(); }

function pausarFala() {
  if (!synth) return;
  const btn = document.getElementById('pause-btn');
  if (synth.paused) {
    synth.resume();
    btn.querySelector('i').className = 'ti ti-player-pause';
    btn.classList.remove('pause-active');
    setEstado('falando','BOB está falando...');
  } else if (synth.speaking) {
    synth.pause();
    btn.querySelector('i').className = 'ti ti-player-play';
    btn.classList.add('pause-active');
    setEstado('','Em pausa — clique para continuar');
  } else {
    synth.cancel();
    btn.querySelector('i').className = 'ti ti-player-pause';
    btn.classList.remove('pause-active');
    setEstado('','Clique no anel ou no microfone para falar');
    document.getElementById('ring').classList.remove('falando');
  }
}

// Saudação inicial
setTimeout(() => {
  if (!token) return;
  const saud = `Olá! BOB online. Como posso ajudar?`;
  addMsg('bob', saud);
  mostrarResposta(saud);
  falar(saud);
}, 800);
